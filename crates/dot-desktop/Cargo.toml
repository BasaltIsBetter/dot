[package]
name = "dot-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dot-api.workspace = true
dot-process.workspace = true
dot-transcript.workspace = true
glyphon.workspace = true
pollster.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard.workspace = true
image.workspace = true
rfd.workspace = true
wgpu = { workspace = true, features = ["gles", "vulkan"] }
winit = { workspace = true, features = ["wayland", "wayland-csd-adwaita-notitle", "wayland-dlopen", "x11"] }

[features]
bench = []

[dev-dependencies]
cap.workspace = true
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "interface"
harness = false
required-features = ["bench"]

[lints]
workspace = true
