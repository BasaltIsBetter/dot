name: Idea
description: Something Dot should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing or in the way?
      description: What you were trying to do, and where Dot stopped you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
    validations:
      required: true
