name: Bug
description: Something does not work in Dot.
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Remove any API key, token and personal data from logs and screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Dot on a project
        2. Ask Claude to run the tests
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dot version
      description: On Mac, menu Dot › About Dot; on Linux, the name of the downloaded package (dot-x.y.z-…).
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and processor
      placeholder: macOS 15 Apple silicon, Ubuntu 24.04 x86_64…
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection to Claude
      options:
        - Claude plan (Claude Code)
        - Anthropic account
        - API key
        - Not connected yet
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language of Dot
      placeholder: English, French, Spanish, Portuguese
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The last lines of ~/Library/Logs/Dot/dot.log (Mac) or ~/.local/state/dot/dot.log (Linux), read over before pasting them.
      render: text
