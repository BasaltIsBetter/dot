[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
cap = "0.1.2"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
dot-api = { path = "crates/dot-api" }
dot-auth = { path = "crates/dot-auth" }
dot-compact = { path = "crates/dot-compact" }
dot-desktop = { path = "crates/dot-desktop" }
dot-i18n = { path = "crates/dot-i18n" }
dot-model = { path = "crates/dot-model" }
dot-process = { path = "crates/dot-process" }
dot-session = { path = "crates/dot-session" }
dot-tool = { path = "crates/dot-tool" }
dot-transcript = { path = "crates/dot-transcript" }
fluent-bundle = "0.16.0"
globset = "0.4.21"
glyphon = "0.12.0"
ignore = "0.4.34"
libc = { version = "0.2.191", default-features = false }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSColor", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSLocale", "NSString"] }
pollster = "1.0.1"
proptest = "1.12.0"
regex = "1.13.2"
rustix = { version = "1.1.6", default-features = false, features = ["event", "std"] }
security-framework = "3.7.0"
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
unic-langid = "0.9.6"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "metal"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.mutants]
inherits = "dev"
debug = 0

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
