name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notes:
    name: Version and notes
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the version of Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_ENV"
      - name: Notes from CHANGELOG.md
        run: |
          mkdir dist
          {
            ./crates/dot/release/notes.sh "$version" CHANGELOG.md
            echo
            sed "s/{version}/$version/g" crates/dot/release/install.md
          } > dist/notes.md
          cat dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: dist/notes.md
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Dot for macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build and pack
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          app="$(./crates/dot/macos/bundle.sh | tail -n 1)"
          mkdir dist
          ditto -c -k --keepParent "$app" "dist/Dot-$version-macos-arm64.zip"
          ditto -c -k --keepParent "$app.dSYM" "dist/Dot-$version-macos-arm64.dSYM.zip"
      - name: Install the app into an empty home
        run: |
          home="$(mktemp -d)"
          unpacked="$(mktemp -d)"
          ditto -x -k dist/Dot-*-macos-arm64.zip "$unpacked"
          HOME="$home" ./crates/dot/macos/install.sh "$unpacked/Dot.app"
          test -x "$home/Applications/Dot.app/Contents/MacOS/dot-shell"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Dot for Linux ${{ matrix.arch }} (glibc of Ubuntu 22.04)
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build and pack
        run: echo "archive=$(./crates/dot/linux/bundle.sh | tail -n 1)" >> "$GITHUB_ENV"
      - name: Install the bundle into an empty home
        run: |
          home="$(mktemp -d)"
          unpacked="$(mktemp -d)"
          tar -xzf "$archive" -C "$unpacked"
          HOME="$home" XDG_DATA_HOME= "$unpacked"/*/install.sh
          test -x "$home/.local/bin/dot"
          grep -q '^Exec="'"$home"'/.local/share/dot-app/bin/dot" %f$' "$home/.local/share/applications/dev.dot.desktop.desktop"
      - name: Newest glibc symbol the programs need
        run: tar -xzOf "$archive" --wildcards '*/bin/dot' > dot && objdump -T dot | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
      - name: Keep the archive for the release
        run: mkdir dist && cp "$archive" dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  ci-passed:
    name: CI passed on this commit
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
    steps:
      - name: Wait for ci.yml on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 140); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '
              [.workflow_runs[] | select(.status == "completed") | .conclusion] as $ended
              | if any($ended[]; . == "success") then "success"
                elif any($ended[]; . == "failure" or . == "timed_out") then "failure"
                else "waiting" end')" || state="unreachable"
            echo "attempt $attempt: ci on $GITHUB_SHA is $state"
            case "$state" in
              success) exit 0 ;;
              failure) exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::ci.yml did not finish on $GITHUB_SHA in 70 minutes"
          exit 1

  publish:
    name: GitHub pre-release
    needs: [notes, macos, linux, ci-passed]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum Dot-*.zip dot-*.tar.gz | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Dot ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md \
            dist/Dot-*.zip dist/dot-*.tar.gz dist/SHA256SUMS
